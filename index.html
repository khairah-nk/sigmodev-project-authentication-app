<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Authentication App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 id="form-title">Login </h2>
    <img src="login.png" alt="Login Image" height="250px">

<div>
<label for="username">Username:</label>
<input type="text" id="username" name="username" required>

</div>

<div>
<label for="password">Password:</label>
<input type="password" id="password" name="password" required>
</div>

<div id="confirm-password-container" style="display: none;">
    <label for="confirm-password">Confirm Password:</label>
    <input type="password" id="confirm-password" name="confirm-password" required>
</div>

<button id="submit" onclick="handleSubmit()">Login</button>
<p>Don't have an account? 
    <span id="toggle-link" onclick="toggleAuth()">Sign up

    </span>
</p>

    <script src="script.js"></script>
</body>
</html>
